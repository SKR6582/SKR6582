<svg fill="none" viewBox="0 0 800 280" width="800" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .divider { stroke: #d0d7de; stroke-width: 1; }
      .filename { fill: #0969da; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; font-weight: 600; }
      .tag { fill: #656d76; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
      .desc { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13.5px; }
      .label { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; }
      .text { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; }
      .highlight { fill: #0969da; font-weight: 600; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect class="bg" x="1" y="1" width="798" height="278" rx="12" />

  <!-- Titlebar -->
  <circle cx="32" cy="26" r="6" fill="#ff5f56" />
  <circle cx="50" cy="26" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="26" r="6" fill="#27c93f" />
  <text class="filename" x="88" y="31">about_me.json</text>
  <text class="tag" x="770" y="31" text-anchor="end">JSON Configuration</text>

  <!-- Divider -->
  <line class="divider" x1="24" y1="48" x2="776" y2="48" />

  <!-- Description -->
  <text class="desc" x="24" y="74">I am a student developer passionate about building automation tools, Discord bots, AI-driven applications,</text>
  <text class="desc" x="24" y="94">and cross-platform mobile apps.</text>

  <!-- Info List -->
  <g transform="translate(24, 130)">
    <!-- Item 1 -->
    <text y="0">
      <tspan class="text">🔬 </tspan>
      <tspan class="label">Current Work: </tspan>
      <tspan class="text">Developing </tspan>
      <tspan class="text highlight">LingoLens</tspan>
      <tspan class="text"> (macOS Real-time OCR Translator) and </tspan>
      <tspan class="text highlight">ska_manager</tspan>
      <tspan class="text"> (Study room seat system).</tspan>
    </text>

    <!-- Item 2 -->
    <text y="32">
      <tspan class="text">💬 </tspan>
      <tspan class="label">Interests: </tspan>
      <tspan class="text">Discord Bot development, API automation, and LLM integrations.</tspan>
    </text>

    <!-- Item 3 -->
    <text y="64">
      <tspan class="text">🌱 </tspan>
      <tspan class="label">Learning: </tspan>
      <tspan class="text">SwiftUI, Advanced Flutter techniques, and System Utilities.</tspan>
    </text>

    <!-- Item 4 -->
    <text y="96">
      <tspan class="text">🔗 </tspan>
      <tspan class="label">Portfolio: </tspan>
      <tspan class="text highlight">skr6582-portfolio.vercel.app</tspan>
    </text>
  </g>
</svg>
