<svg fill="none" viewBox="0 0 840 240" width="840" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradLight" x1="0" y1="0" x2="840" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f8fa" />
    </linearGradient>
    <style>
      .card { fill: url(#bgGradLight); stroke: #d0d7de; stroke-width: 1.5; }
      .subcard { fill: #ffffff; stroke: #d8dee4; stroke-width: 1; }
      .title { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
      .handle { fill: #656d76; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; font-weight: 500; }
      .bio { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; }
      .kicker { fill: #0969da; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; }
      .item-title { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; }
      .item-sub { fill: #57606a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; }
      .badge { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .badge-text { fill: #24292f; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; }
    </style>
  </defs>

  <rect class="card" x="1" y="1" width="838" height="238" rx="14" />

  <!-- Top Header -->
  <text class="title" x="32" y="46">Oh Seungjun</text>
  <text class="handle" x="184" y="45">@SKR6582</text>

  <rect class="badge" x="646" y="24" width="162" height="28" rx="6" />
  <text class="badge-text" x="727" y="42" text-anchor="middle">macOS / Web / AI</text>

  <text class="bio" x="32" y="76">Building native macOS utilities, smart classroom platforms, and LLM-powered automation systems.</text>

  <!-- Bento Grid Row -->
  <!-- Box 1: Pinned Focus -->
  <rect class="subcard" x="32" y="100" width="250" height="112" rx="10" />
  <text class="kicker" x="48" y="124">PINNED FOCUS</text>
  <text class="item-title" x="48" y="148">ReadIt &amp; remsleep</text>
  <text class="item-sub" x="48" y="168">On-device Vision OCR translator</text>
  <text class="item-sub" x="48" y="186">&amp; native macOS system utilities</text>

  <!-- Box 2: Smart Classroom -->
  <rect class="subcard" x="295" y="100" width="250" height="112" rx="10" />
  <text class="kicker" x="311" y="124">EDUCATION &amp; WEB</text>
  <text class="item-title" x="311" y="148">Yochiyochi &amp; Classroom TV</text>
  <text class="item-sub" x="311" y="168">Electron interactive classroom app</text>
  <text class="item-sub" x="311" y="186">&amp; 16:9 NEIS school TV dashboards</text>

  <!-- Box 3: AI & Bots -->
  <rect class="subcard" x="558" y="100" width="250" height="112" rx="10" />
  <text class="kicker" x="574" y="124">AI &amp; AUTOMATION</text>
  <text class="item-title" x="574" y="148">Milky, Iro &amp; Security Bots</text>
  <text class="item-sub" x="574" y="168">LLM streaming bots, MCP servers,</text>
  <text class="item-sub" x="574" y="186">&amp; Discord server protection suite</text>
</svg>
