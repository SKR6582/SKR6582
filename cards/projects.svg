<svg fill="none" viewBox="0 0 840 420" width="840" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .divider { stroke: #21262d; stroke-width: 1; }
      .filename { fill: #58a6ff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 600; }
      .tag { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
      .sec-title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .p-name { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .p-desc { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; }
      .p-tech { fill: #79c0ff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="838" height="418" rx="12" />
  <text class="filename" x="28" y="30">featured_repositories</text>
  <text class="tag" x="812" y="30" text-anchor="end">2026 Snapshot</text>
  <line class="divider" x1="24" y1="46" x2="816" y2="46" />

  <text class="sec-title" x="28" y="74">MACOS &amp; DESKTOP APPS</text>
  <text x="28" y="98">
    <tspan class="p-name">ReadIt</tspan>
    <tspan class="p-desc"> - On-device macOS screen OCR &amp; translation overlay with Notch HUD </tspan>
    <tspan class="p-tech">[Swift, Vision, Translation]</tspan>
  </text>
  <text x="28" y="122">
    <tspan class="p-name">remsleep</tspan>
    <tspan class="p-desc"> - Clamshell sleep blocker &amp; display dimmer with Touch ID auth </tspan>
    <tspan class="p-tech">[Swift, SwiftUI, IOKit]</tspan>
  </text>
  <text x="28" y="146">
    <tspan class="p-name">Yochiyochi</tspan>
    <tspan class="p-desc"> - Smart classroom Japanese learning &amp; stroke whiteboard desktop app </tspan>
    <tspan class="p-tech">[Electron, React, TS]</tspan>
  </text>

  <text class="sec-title" x="28" y="186">SMART CLASSROOM &amp; WEB</text>
  <text x="28" y="210">
    <tspan class="p-name">Classroom_TV_Lite</tspan>
    <tspan class="p-desc"> - 16:9 school TV dashboard for Termux, Raspberry Pi, and PC </tspan>
    <tspan class="p-tech">[Python, JS, NEIS API]</tspan>
  </text>
  <text x="28" y="234">
    <tspan class="p-name">classroom_v4</tspan>
    <tspan class="p-desc"> - Modular Glass UI classroom signage &amp; admin platform </tspan>
    <tspan class="p-tech">[Next.js 15, TypeScript]</tspan>
  </text>
  <text x="28" y="258">
    <tspan class="p-name">ska_manager</tspan>
    <tspan class="p-desc"> - Study room seat reservation &amp; management web platform </tspan>
    <tspan class="p-tech">[Next.js, React, TS]</tspan>
  </text>

  <text class="sec-title" x="28" y="298">AI AGENTS, LLM &amp; DISCORD</text>
  <text x="28" y="322">
    <tspan class="p-name">Milky &amp; DiscordBot-Iro</tspan>
    <tspan class="p-desc"> - Streaming LLM character &amp; conversational bots </tspan>
    <tspan class="p-tech">[TypeScript, Python, PostgreSQL]</tspan>
  </text>
  <text x="28" y="346">
    <tspan class="p-name">discord_protect / Orbit / Vanguard</tspan>
    <tspan class="p-desc"> - Server anomaly defense, backup &amp; moderation </tspan>
    <tspan class="p-tech">[Python, Py-cord]</tspan>
  </text>
  <text x="28" y="370">
    <tspan class="p-name">Virtual_Keyboard &amp; keychain_cli</tspan>
    <tspan class="p-desc"> - Camera ML virtual keyboard &amp; secret scanner </tspan>
    <tspan class="p-tech">[Python, CV, ML]</tspan>
  </text>
</svg>
